<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#000}iframe{width:430px;height:1000px;border:0}</style></head>
<body><iframe id="f" src="../docs/index.html?demo&nointro=1&form=pane"></iframe>
<script>
document.getElementById('f').addEventListener('load', () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument;
  const form = d.querySelector('[data-form="pane"]');
  const pay = form.querySelector('input[value="money"]');
  pay.click();   // a real click, so :has(input:checked) is exercised honestly
  form.scrollIntoView({ block: 'start' });
}, 1000));
</script></body></html>
