<!DOCTYPE html>
<!-- The share card. Rendered once to docs/og.png at 1200x630.
     WhatsApp and iMessage will not read SVG or run CSS, so what gets
     pasted has to be a flat picture: this page exists to be photographed. -->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B0908;
    background-image: radial-gradient(70% 90% at 30% 46%, #2B1D12 0%, #0B0908 62%);
    display: grid;
    grid-template-columns: 420px 1fr;
    align-items: center;
    font-family: "Archivo", system-ui, sans-serif;
    color: #EDE4CF;
    position: relative;
  }

  /* the double gold rule, same as the invitation's frontispiece */
  .frame {
    position: absolute;
    inset: 34px;
    border: 1px solid rgba(200, 160, 58, 0.55);
    outline: 4px solid #0B0908;
    outline-offset: 3px;
    box-shadow: 0 0 0 5px rgba(200, 160, 58, 0.28);
    pointer-events: none;
  }

  .flamewrap { display: grid; place-items: center; position: relative; }
  .glow {
    position: absolute;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,176,74,0.30) 0%, rgba(196,92,20,0.13) 34%, transparent 68%);
  }
  svg.match { width: 168px; height: auto; position: relative; }

  .text { padding-right: 96px; }
  .kicker {
    font-size: 19px; font-weight: 600; letter-spacing: 0.42em;
    text-transform: uppercase; color: #C8A03A;
  }
  .the {
    font-family: "DM Serif Display", serif; font-style: italic;
    font-size: 44px; color: #F2D88C; margin-top: 26px; line-height: 1;
  }
  .name {
    font-family: "DM Serif Display", serif;
    font-size: 156px; line-height: 0.9; letter-spacing: -0.01em; color: #EDE4CF;
  }
  .rule { height: 1px; background: rgba(200,160,58,0.45); margin: 34px 0 26px; width: 74%; }
  .facts {
    font-family: "Courier Prime", monospace; font-size: 26px;
    letter-spacing: 0.02em; color: #DED2B6; line-height: 1.65;
  }
  .facts b { color: #EDE4CF; font-weight: 700; }
</style></head>
<body>
<div class="frame"></div>

<div class="flamewrap">
  <div class="glow"></div>
  <svg class="match" viewBox="0 0 120 260" aria-hidden="true">
    <defs>
      <radialGradient id="core" cx="50%" cy="62%" r="55%">
        <stop offset="0%" stop-color="#FFF6D8"/>
        <stop offset="45%" stop-color="#FFD166"/>
        <stop offset="100%" stop-color="#F08A24" stop-opacity="0.15"/>
      </radialGradient>
      <radialGradient id="halo" cx="50%" cy="60%" r="50%">
        <stop offset="0%" stop-color="#FF9E2C" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#B03A0C" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M57.3 104 L61.7 104 L62.8 212 Q59.5 215.5 56.2 212 Z" fill="#8A6038"/>
    <path d="M59.5 112 L59.5 203" stroke="#6B4526" stroke-width="0.8" opacity="0.55"/>
    <path d="M59.5 86 C 67 86, 70.5 93.5, 69.5 101 C 68.5 109, 64 113.5, 59.5 113.5
             C 55 113.5, 50.5 109, 49.5 101 C 48.5 93.5, 52 86, 59.5 86 Z" fill="#2A1E17"/>
    <path d="M59.5 26 C 84 58, 86 84, 59.5 104 C 33 84, 35 58, 59.5 26 Z" fill="url(#halo)"/>
    <path d="M59.5 52 C 73 70, 74 88, 59.5 101 C 45 88, 46 70, 59.5 52 Z" fill="url(#core)"/>
  </svg>
</div>

<div class="text">
  <p class="kicker">By invitation</p>
  <p class="the">the</p>
  <p class="name">Oath</p>
  <div class="rule"></div>
  <p class="facts">
    An Italian potluck<br>
    <b>Monday, August 17</b> &nbsp;·&nbsp; 7:30 pm<br>
    Sandra's place, Gardena
  </p>
</div>
</body></html>
