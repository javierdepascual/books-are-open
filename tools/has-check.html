<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#fff;font:15px ui-monospace,monospace}pre{padding:10px}
iframe{width:430px;height:900px;border:0}</style></head>
<body><pre id="o">…</pre>
<iframe id="f" src="../docs/index.html?demo&nointro=1&form=pane"></iframe>
<script>
document.getElementById('f').addEventListener('load', () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument, w = d.defaultView;
  const form = d.querySelector('[data-form="pane"]');
  const out = [];
  const sel = () => {
    const hits = [...d.querySelectorAll('.mode input:checked + span')];
    return hits.map(s => s.textContent.trim()).join(' | ') || '(none)';
  };
  const border = v => {
    const i = form.querySelector('input[value="' + v + '"]');
    return w.getComputedStyle(i.nextElementSibling).borderColor;
  };
  out.push('start   matched by selector: ' + sel());
  out.push('        cooking=' + border('cooking'));
  out.push('        money  =' + border('money'));

  // click the LABEL, exactly as a finger would
  form.querySelector('input[value="money"]').closest('label').click();

  out.push('after   matched by selector: ' + sel());
  out.push('        cooking=' + border('cooking'));
  out.push('        money  =' + border('money'));
  document.getElementById('o').textContent = out.join('\n');
}, 1000));
</script></body></html>
